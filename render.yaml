services:
  - type: web
    name: vid2manga-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn App.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.12.2
      # Add other environment variables here (GCP keys, etc.)
    # IMPORTANT: You must manually add the FFmpeg Buildpack in the Render Dashboard
    # under Settings -> Buildpacks.
