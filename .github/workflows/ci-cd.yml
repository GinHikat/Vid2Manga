name: Vid2Manga CI/CD Pipeline

# 1. EVENT TRIGGER: Run automatically whenever code is pushed to main or a Pull Request is opened
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Automated Unit Testing & Code Quality Verification
  test:
    name: Run Automated Tests & Hygiene Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source code onto the GitHub cloud runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.12 with pip caching for fast builds
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Step 3: Install Linux system dependencies (FFmpeg, OpenCV libGL, libsndfile)
      - name: Install System Binaries (FFmpeg, OpenGL, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1 \
            libgl1 \
            libglib2.0-0 \
            build-essential

      # Step 4: Install CPU PyTorch wheels & Python requirements
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      # Step 5: Run Unit Test Suite (Runs in <20 seconds!)
      - name: Run Unit Tests
        run: |
          python -m unittest discover -s modules/test -p "test_*.py"

  # JOB 2: Build & Push Production Docker Image (if Job 1 succeeds)
  build-and-push:
    name: Build & Push Docker Image to Container Registry
    needs: test 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry (ghcr.io) using automatic secrets
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for advanced layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Docker Container Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }} # Push only on main branch
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
